name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: httpmaker_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d httpmaker_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/httpmaker_ci
      HTTPMAKER_AI_PROVIDER: mock
      AUTH_SECRET: ci-only-placeholder-secret-at-least-32-characters
      AUTH_GITHUB_ID: ci-placeholder
      AUTH_GITHUB_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          AUTH_URL: http://localhost:3000
      - run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://httpmaker.invalid
          AUTH_URL: https://httpmaker.invalid
          AUTH_SECRET: 9f74c01306e84ee6a5f783fc948866fa9f74c01306e84ee6a5f783fc948866fa
          AUTH_GITHUB_ID: ci-github-id
          AUTH_GITHUB_SECRET: ci-github-secret
          AUTH_GOOGLE_ID: ci-google-id
          AUTH_GOOGLE_SECRET: ci-google-secret
          BLOB_READ_WRITE_TOKEN: vercel_blob_rw_ci_00000000000000000000000000000000
          RATE_LIMIT_REST_URL: https://rate-limit.invalid
          RATE_LIMIT_REST_TOKEN: ci-rate-limit-token
      - run: npx playwright install --with-deps chromium
      - run: npm run test:security:browser
      - run: npm audit --omit=dev --audit-level=high
