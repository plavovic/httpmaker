name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/httpmaker_ci
      HTTPMAKER_AI_PROVIDER: mock
      AUTH_SECRET: ci-only-placeholder-secret-at-least-32-characters
      AUTH_GITHUB_ID: ci-placeholder
      AUTH_GITHUB_SECRET: ci-placeholder
      HTTPMAKER_ENABLE_GLOBAL_GITHUB_APP: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
